# Cloudflare Python Workers deployment config (read by pywrangler).
# Local uvicorn development uses requirements-local.txt + .venv (pywrangler refuses to run if requirements.txt exists).
# Keep this file ASCII-only: pywrangler may read it with the OS default encoding (cp949 on Korean Windows).
[project]
name = "nearme-backend"
version = "1.1.0"
description = "NearMe Backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
