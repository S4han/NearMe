# Cloudflare Python Workers 배포용 설정 (pywrangler가 읽음)
# 로컬 uvicorn 개발은 requirements-local.txt + .venv 사용 (pywrangler는 requirements.txt가 있으면 실행을 거부함)
[project]
name = "nearme-backend"
version = "1.1.0"
description = "NearMe Backend (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
